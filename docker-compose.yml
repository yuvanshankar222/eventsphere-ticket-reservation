version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventsphere_user
      POSTGRES_PASSWORD: eventsphere_pass
      POSTGRES_DB: eventsphere_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsphere_user -d eventsphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventsphere-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://eventsphere_user:eventsphere_pass@postgres:5432/eventsphere_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: eventsphere_production_super_secret_key_change_me
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
